<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<title>Каталог оптовых цен</title>
<style>
:root{--primary:#1a237e;--primary-light:#314796;--bg:#f4f6f9;--white:#fff;--text:#333;--border:#ddd;--danger:#d32f2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
header{background:var(--primary);color:#fff;padding:12px 16px}
h1{margin:0;font-size:20px}.subtitle{font-size:12px;opacity:.9;margin-top:4px}
.top-bar{display:flex;gap:10px;margin:10px}
.btn-nav{background:#fff;color:var(--primary);padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.08);flex:1;justify-content:center;border:none;cursor:pointer;font-size:15px}
.badge{background:#f0a500;color:#333;border-radius:12px;padding:1px 8px;font-size:13px;min-width:22px;text-align:center}
.controls{display:flex;gap:10px;margin:0 10px 10px;flex-wrap:wrap}
select,input[type=text],input[type=number]{padding:12px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:#fff}
#category-filter{flex:1;min-width:140px}#search-input{flex:1.4;min-width:150px}
.product-list{padding:0 10px}
.product-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);display:flex;gap:12px;align-items:center}
.prod-img{width:54px;height:54px;background:#eceff3;border-radius:10px;flex-shrink:0}
.prod-info{flex:1;min-width:0}.prod-name{font-size:15px;font-weight:700;line-height:1.3}
.prod-cat{font-size:12px;color:#777;margin-top:2px}.prod-price{font-size:17px;font-weight:800;color:var(--primary);margin-top:4px}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.qty-controls{display:flex;align-items:center;gap:6px}
.qty-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-weight:800;font-size:18px;cursor:pointer}
.qty-input{width:44px;height:34px;text-align:center;border:1.5px solid var(--primary);border-radius:10px;font-size:15px;font-weight:700}
.btn-add{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-more{display:block;margin:14px auto;background:var(--primary-light);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.pwa-banner{background:#e3ecf7;color:#1a237e;padding:10px 14px;margin:0 10px 12px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:13px}
.pwa-banner button{background:none;border:none;color:#555;cursor:pointer;font-size:18px;margin-left:auto}
.status-msg{text-align:center;color:#777;padding:40px 20px;font-size:15px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2000}
.toast.show{opacity:1}
.settings-btn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:var(--primary);color:#fff;border-radius:50%;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:1000}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:3000;display:none;justify-content:flex-end;flex-direction:column}
.modal-overlay.active{display:flex}
.modal{background:#fff;padding:20px;border-radius:20px 20px 0 0;max-height:85vh;overflow-y:auto;position:relative}
.modal h3{margin:0 0 16px;color:var(--primary)}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#999}
.form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:5px;font-size:13px;color:#555}
.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.btn-modal{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px}
.order-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.btn-danger{background:#fdecea;color:var(--danger);border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<header><h1>Каталог оптовых цен</h1><span class="subtitle">Цены оптовые, без НДС, с доставкой</span></header>
<div class="top-bar">
<button class="btn-nav" onclick="openCart()">🛒 Корзина <span class="badge" id="cart-count">0</span></button>
<button class="btn-nav" onclick="openRequests()">📋 Заявки <span class="badge" id="requests-count">0</span></button>
</div>
<div class="controls">
<select id="category-filter" onchange="resetAndRender()"><option value="">Все категории</option></select>
<input type="text" id="search-input" placeholder="🔍 Поиск товара" oninput="resetAndRender()">
</div>
<div class="pwa-banner" id="pwa-banner"><span>📱 Добавьте каталог на главный экран — будет работать как приложение.</span><button onclick="closeBanner()">×</button></div>
<div class="product-list" id="products-container"></div>
<button class="btn-more" id="more-btn" onclick="showMore()" style="display:none">Показать ещё</button>
<button class="settings-btn" onclick="openOrderModal()">⚙️</button>
<div class="toast" id="toast">Сохранено!</div>
<div class="modal-overlay" id="order-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('order-modal')">×</button><h3>Подпись и поставщик</h3>
<div class="form-group"><label>Поставщик (для шапки накладной)</label><input type="text" id="supplier-name"></div>
<div class="form-group"><label>ФИО для строки «Отпустил»</label><input type="text" id="released-by"></div>
<div class="form-group"><label>Следующий номер накладной</label><input type="text" id="next-invoice"></div>
<button class="btn-modal" onclick="saveOrderSettings()">Сохранить</button></div></div>
<div class="modal-overlay" id="cart-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('cart-modal')">×</button><h3>Корзина</h3><div id="cart-body"></div>
<button class="btn-modal" id="order-btn" onclick="makeOrder()">Оформить заявку</button></div></div>
<div class="modal-overlay" id="requests-modal"><div class="modal">
<button class="modal-close" onclick="closeModal('requests-modal')">×</button><h3>Заявки</h3><div id="requests-body"></div></div></div>

const PAGE = 40;
let cart = loadAny('catalog_cart','katalog_cart') || {};
let orderSettings = loadAny('catalog_order_settings','katalog_order_settings') || {};
let requests = loadAny('catalog_requests','katalog_requests') || [];
let allProducts = [], uniqueCategories = [], shown = PAGE, curList = [];

function loadAny(a,b){try{const v=localStorage.getItem(a);if(v!==null)return JSON.parse(v);const w=localStorage.getItem(b);return w!==null?JSON.parse(w):null}catch(e){return null}}
function init(){
  (CATALOG_DATA.groups||[]).forEach(g=>{(g.items||[]).forEach(it=>allProducts.push({id:it.id,name:it.n,price:it.p,category:g.name}))});
  uniqueCategories=[...new Set(allProducts.map(p=>p.category))];
  const sel=document.getElementById('category-filter');
  uniqueCategories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
  render();
  if(localStorage.getItem('pwa_banner_closed')==='true')document.getElementById('pwa-banner').style.display='none';
}
function render(){
  const cat=document.getElementById('category-filter').value;
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  let list=allProducts;
  if(cat)list=list.filter(p=>p.category===cat);
  if(q)list=list.filter(p=>p.name.toLowerCase().includes(q));
  curList=list;shown=PAGE;drawItems();
}
function resetAndRender(){render()}
function drawItems(){
  const c=document.getElementById('products-container');c.innerHTML='';
  if(curList.length===0){c.innerHTML='<p class="status-msg">Товары не найдены</p>';document.getElementById('more-btn').style.display='none';return}
  curList.slice(0,shown).forEach(p=>{
    const qty=cart[p.id]||0;
    const d=document.createElement('div');d.className='product-item';
    d.innerHTML='<div class="prod-img"></div><div class="prod-info"><div class="prod-name">'+esc(p.name)+'</div><div class="prod-cat">'+esc(p.category)+'</div><div class="prod-price">'+fmt(p.price)+'</div></div>';
    const rc=document.createElement('div');rc.className='right-col';
    const qc=document.createElement('div');qc.className='qty-controls';
    const m=document.createElement('button');m.className='qty-btn';m.textContent='−';m.onclick=()=>bump(p.id,-1);
    const inp=document.createElement('input');inp.type='number';inp.className='qty-input';inp.min='0';inp.value=qty;inp.dataset.pid=p.id;
    const pl=document.createElement('button');pl.className='qty-btn';pl.textContent='+';pl.onclick=()=>bump(p.id,1);
    qc.appendChild(m);qc.appendChild(inp);qc.appendChild(pl);
    const ab=document.createElement('button');ab.className='btn-add';ab.textContent='В корзину';ab.onclick=()=>addCart(p.id,inp);
    rc.appendChild(qc);rc.appendChild(ab);d.appendChild(rc);c.appendChild(d);
  });
  const mb=document.getElementById('more-btn');
  if(shown<curList.length){mb.style.display='block';mb.textContent='Показать ещё ('+(curList.length-shown)+')'}else mb.style.display='none';
}
function showMore(){shown+=PAGE;drawItems()}
function bump(id,d){let n=(cart[id]||0)+d;if(n<0)n=0;if(n===0)delete cart[id];else cart[id]=n;save('catalog_cart',cart);updCounts();syncInputs(id)}
function syncInputs(id){document.querySelectorAll('.qty-input').forEach(i=>{if(i.dataset.pid===id)i.value=cart[id]||0})}
function addCart(id,inp){const q=parseInt(inp.value,10)||0;if(q<=0){toast('Укажите количество');return}cart[id]=q;save('catalog_cart',cart);updCounts();toast('Добавлено: '+q+' шт')}
function setQtyFromInput(id,v){const n=parseInt(v,10)||0;if(n<=0)delete cart[id];else cart[id]=n;save('catalog_cart',cart);updCounts()}
function updCounts(){
  document.getElementById('cart-count').textContent=Object.values(cart).reduce((s,q)=>s+q,0);
  document.getElementById('requests-count').textContent=requests.length;
}
function openCart(){
  const ids=Object.keys(cart);
  if(ids.length===0){toast('Корзина пуста');return}
  const b=document.getElementById('cart-body');let total=0,html='';
  ids.forEach(id=>{const p=allProducts.find(x=>x.id===id);if(!p)return;const sum=p.price*cart[id];total+=sum;
    html+='<div class="order-row"><span>'+esc(p.name)+' × '+cart[id]+'</span><b>'+fmt(sum)+'</b></div>'});
  html+='<div class="order-row" style="font-size:16px"><b>Итого</b><b>'+fmt(total)+'</b></div>';
  b.innerHTML=html;document.getElementById('order-btn').style.display='block';
  document.getElementById('cart-modal').classList.add('active');
}
function makeOrder(){
  if(!orderSettings.supplier){closeModal('cart-modal');toast('Заполните настройки (⚙️)');return}
  const num=orderSettings.nextInvoice||'1';
  const items=Object.keys(cart).map(id=>{const p=allProducts.find(x=>x.id===id);return p?{name:p.name,qty:cart[id],price:p.price,sum:+(p.price*cart[id]).toFixed(2)}:null}).filter(Boolean);
  const total=items.reduce((s,i)=>s+i.sum,0);
  requests.push({number:num,date:new Date().toLocaleString('ru-RU'),supplier:orderSettings.supplier,releasedBy:orderSettings.releasedBy||'',items:items,total:+total.toFixed(2)});
  save('catalog_requests',requests);
  cart={};save('catalog_cart',cart);
  orderSettings.nextInvoice=String(parseInt(num,10)+1);save('catalog_order_settings',orderSettings);
  closeModal('cart-modal');updCounts();render();toast('Заявка № '+num+' сохранена');
}
function openRequests(){
  const b=document.getElementById('requests-body');
  if(requests.length===0){b.innerHTML='<p class="status-msg">Заявок пока нет</p>'}
  else{let html='';
    requests.slice().reverse().forEach((r,idx)=>{
      const i=requests.length-1-idx;
      html+='<div class="order-row"><span>Заявка № '+esc(r.number)+'<br><small>'+esc(r.date)+' — '+fmt(r.total)+'</small></span><button class="btn-danger" onclick="delRequest('+i+')">Удалить</button></div>'});
    b.innerHTML=html}
  document.getElementById('requests-modal').classList.add('active');
}
function delRequest(i){requests.splice(i,1);save('catalog_requests',requests);updCounts();openRequests()}
function openOrderModal(){
  document.getElementById('supplier-name').value=orderSettings.supplier||'';
  document.getElementById('released-by').value=orderSettings.releasedBy||'';
  document.getElementById('next-invoice').value=orderSettings.nextInvoice||'';
  document.getElementById('order-modal').classList.add('active');
}
function saveOrderSettings(){
  orderSettings={supplier:document.getElementById('supplier-name').value,releasedBy:document.getElementById('released-by').value,nextInvoice:document.getElementById('next-invoice').value};
  save('catalog_order_settings',orderSettings);closeModal('order-modal');toast('Настройки сохранены');
}
function closeModal(id){document.getElementById(id).classList.remove('active')}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('active')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.active').forEach(o=>o.classList.remove('active'))});
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function closeBanner(){document.getElementById('pwa-banner').style.display='none';localStorage.setItem('pwa_banner_closed','true')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function fmt(p){return p.toFixed(2).replace('.',',')+' ₽'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
document.addEventListener('DOMContentLoaded',init);
</script>
